<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mental Health Chatbot</title>
    <style>
      body {
        font-family: "Arial", sans-serif;
        background-color: #121212;
        color: white;
        text-align: center;
        margin: 0;
        padding: 20px;
      }

      h1 {
        color: #ffcc00;
      }

      #setup-container,
      #chat-container {
        background: #1e1e1e;
        padding: 20px;
        border-radius: 10px;
        width: 90%;
        max-width: 500px;
        margin: 10px auto;
        box-shadow: 0 4px 8px rgba(255, 255, 255, 0.1);
      }

      input,
      textarea {
        width: calc(100% - 20px);
        padding: 10px;
        margin: 10px 0;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        background: #2a2a2a;
        color: white;
      }

      textarea {
        height: 60px;
        resize: none;
      }

      button {
        width: 100%;
        padding: 12px;
        font-size: 16px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        margin-top: 10px;
        background-color: #ffcc00;
        color: black;
        font-weight: bold;
      }

      button:hover {
        background-color: #ffaa00;
      }

      #chatbox {
        margin-top: 10px;
        text-align: left;
        max-width: 500px;
        height: 300px;
        overflow-y: auto;
        padding: 10px;
        border-radius: 5px;
        background: #2a2a2a;
        box-shadow: 0 2px 5px rgba(255, 255, 255, 0.1);
      }

      .message {
        padding: 10px;
        margin: 8px 0;
        border-radius: 10px;
        max-width: 80%;
      }

      .user {
        background: #ffcc00;
        color: black;
        align-self: flex-end;
      }

      .bot {
        background: #333;
        color: white;
        align-self: flex-start;
      }
    </style>
  </head>
  <body>
    <h1>Mental Health Chatbot</h1>

    <!-- Step 1: Ask for Relationship & Nickname -->
    <div id="setup-container">
      <label for="relationship"
        >Who should respond as? (e.g., Mom, Dad, Friend):</label
      >
      <input type="text" id="relationship" />

      <label for="nickname"
        >How should they call you? (e.g., buddy, your name):</label
      >
      <input type="text" id="nickname" />

      <button onclick="startChat()">Start Chat</button>
    </div>

    <!-- Step 2: Chat Interface -->
    <div id="chat-container" style="display: none">
      <h3>Chat with AI</h3>

      <div id="chatbox"></div>

      <textarea id="message" placeholder="Type your message..."></textarea>
      <button onclick="sendMessage()">Send</button>
      <button onclick="startRecording()">🎤 Talk</button>
    </div>

    <script>
      let chatHistory = [];

      function startChat() {
        const relationship = document
          .getElementById("relationship")
          .value.trim();
        const nickname = document.getElementById("nickname").value.trim();

        if (!relationship || !nickname) {
          alert("Please enter both relationship and nickname!");
          return;
        }

        document.getElementById("setup-container").style.display = "none";
        document.getElementById("chat-container").style.display = "block";
      }

      async function sendMessage() {
        const relationship = document
          .getElementById("relationship")
          .value.trim();
        const nickname = document.getElementById("nickname").value.trim();
        const message = document.getElementById("message").value.trim();

        if (!message) return alert("Please enter a message!");

        document.getElementById("message").value = ""; // Clear input field
        chatHistory.push({ user: message, bot: "..." });
        updateChat(chatHistory);

        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, relationship, nickname }),
        });

        const data = await response.json();
        if (data.error) {
          alert(data.error);
          return;
        }

        chatHistory = data.chat_history;
        updateChat(chatHistory);
      }

      async function startRecording() {
        const relationship = document
          .getElementById("relationship")
          .value.trim();
        const nickname = document.getElementById("nickname").value.trim();

        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            audio: true,
          });

          const mediaRecorder = new MediaRecorder(stream);
          const audioChunks = [];

          mediaRecorder.ondataavailable = (event) =>
            audioChunks.push(event.data);
          mediaRecorder.onstop = async () => {
            const audioBlob = new Blob(audioChunks, { type: "audio/wav" });
            const formData = new FormData();
            formData.append("audio", audioBlob);
            formData.append("relationship", relationship);
            formData.append("nickname", nickname);

            chatHistory.push({ user: "🎤 (Voice Message)", bot: "..." });
            updateChat(chatHistory);

            const response = await fetch("/chat", {
              method: "POST",
              body: formData,
            });

            const data = await response.json();
            if (data.error) {
              alert(data.error);
              return;
            }

            chatHistory = data.chat_history;
            updateChat(chatHistory);
          };

          mediaRecorder.start();
          setTimeout(() => mediaRecorder.stop(), 5000);
        } catch (error) {
          alert("Microphone access denied or not available!");
        }
      }

      function updateChat(chatHistory) {
        const chatbox = document.getElementById("chatbox");
        chatbox.innerHTML = "";
        chatHistory.forEach(({ user, bot }) => {
          chatbox.innerHTML += `<div class="message user"><b>You:</b> ${user}</div>`;
          chatbox.innerHTML += `<div class="message bot"><b>AI:</b> ${bot}</div>`;
        });
        chatbox.scrollTop = chatbox.scrollHeight;
      }
    </script>
  </body>
</html>
